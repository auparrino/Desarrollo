name: Publicar app en GitHub Pages

# Compila la app y la publica en la rama gh-pages (GitHub Pages: Settings → Pages →
# "Deploy from a branch" → gh-pages / root).
on:
  push:
    branches: [ccr-a1a0a65e-ulvqvf, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          BASE: /${{ github.event.repository.name }}/
      - run: touch web/dist/.nojekyll
      - name: Publicar en gh-pages
        run: |
          cd web/dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
